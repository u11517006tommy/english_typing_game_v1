<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英打遊戲版本一</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
            background-color: #030712;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, rgba(255, 255, 255, 0.9), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, rgba(255, 255, 255, 0.95), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 230px 190px, rgba(255, 255, 255, 0.8), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 300px 80px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 380px 240px, rgba(255, 255, 255, 0.7), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 450px 150px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 520px 310px, rgba(255, 255, 255, 0.85), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 600px 50px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 710px 220px, rgba(255, 255, 255, 0.6), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 830px 140px, rgba(255, 255, 255, 0.9), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 920px 300px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 1000px 90px, rgba(255, 255, 255, 0.95), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 1100px 400px;
        }

        /* 標題陰影增強文字對比度 */
        .title-glow {
            text-shadow: 0 0 20px rgba(6, 182, 212, 0.6), 0 0 40px rgba(59, 130, 246, 0.4);
        }

        /* 按鈕高螢光立體發光陰影 */
        .button-glow {
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center text-white overflow-hidden select-none relative">

    <main class="flex flex-col items-center justify-center space-y-12 z-10 px-4">
        <!-- 標題：採用純白到亮青色的高對比度漸層與粗體設計 -->
        <h1 class="text-5xl md:text-7xl font-black tracking-wider text-white title-glow text-center drop-shadow-lg">
            英打遊戲版本一
        </h1>

        <!-- 開始按鈕：高對比螢光青色背景、深色醒目文字與高亮邊框 -->
        <button type="button" class="px-14 py-4 text-2xl font-black tracking-widest text-slate-950 bg-gradient-to-r from-cyan-400 via-teal-300 to-cyan-400 rounded-full border-2 border-white button-glow cursor-default focus:outline-none">
            開始
        </button>
    </main>

</body>
</html>
